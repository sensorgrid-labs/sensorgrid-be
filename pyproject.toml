[project]
name = "sensorgrid-be"
version = "0.1.0"
description = "SensorGrid Flask REST API"
requires-python = ">=3.10"
dependencies = [
  "Flask[async]>=3.1.0",
  "SQLAlchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.0",
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
